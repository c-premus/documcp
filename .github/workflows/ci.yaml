name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ hashFiles('go.sum') }}
          restore-keys: go-

      # skip-cache: the action's fact cache silently poisons lint results.
      # golangci-lint stores staticcheck's inter-package facts under
      # /root/.cache/golangci-lint, keyed on a 7-day bucket. On 2026-08-19 a run
      # saved a truncated entry (11 MB, down from the 12 MB it restored); every
      # later run restored it and lost the "(*testing.T).Fatal does not return"
      # fact, so 36 correct `if x == nil { t.Fatal(...) }` guards were reported
      # as SA5011 nil derefs across 9 test files. Nothing in the code changed —
      # v2.12.2 + Go 1.26.6 report 0 issues locally from both a cold and a warm
      # cache, and swapping one t.Fatal to t.Error reproduces CI's output byte
      # for byte. A false red here is expensive: Renovate self-merges on green,
      # so a stuck lint stalls the whole unattended pipeline until the bucket
      # rotates. Re-deriving facts every run costs ~27s (72s vs 45s) and is
      # cheap next to that.
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: v2.12.2
          skip-cache: true

      - name: Migration safety lint
        run: bash scripts/check-migrations.sh

      # The official golang image sets GOTOOLCHAIN=local, so the container
      # build IGNORES go.mod's `toolchain` directive — and because the bare
      # `go` floor still passes, a stale builder tag produces a stale-stdlib
      # binary with no error anywhere. That is not hypothetical: the builder
      # sat on 1.26.4 while go.mod said 1.26.6, shipping 10 reachable stdlib
      # CVEs (incl. GO-2026-4970, an os.Root escape that undercuts our own
      # path-traversal defense) past a green CI. CI itself is immune — its
      # setup-go reads go.mod — which is exactly why nothing caught it.
      - name: Go toolchain agreement (go.mod vs Dockerfile)
        run: |
          set -euo pipefail
          MOD=$(sed -n 's/^toolchain go\([0-9][0-9.]*\)[[:space:]]*$/\1/p' go.mod)
          IMG=$(sed -n 's/^FROM .*[[:space:]]golang:\([0-9][0-9.]*\)-alpine@sha256:.*/\1/p' Dockerfile)
          if [ -z "$MOD" ] || [ -z "$IMG" ]; then
            echo "::error::Could not parse the Go version from go.mod ('$MOD') or Dockerfile ('$IMG') — the guard's pattern has drifted from the file format" >&2
            exit 1
          fi
          if [ "$MOD" != "$IMG" ]; then
            echo "::error::Go toolchain mismatch — go.mod toolchain is go$MOD but the Dockerfile builder is golang:$IMG-alpine. The Dockerfile is what actually ships; bump it (tag AND digest) to match." >&2
            exit 1
          fi
          echo "Go toolchain agrees: go.mod=$MOD Dockerfile=$IMG"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ hashFiles('go.sum') }}
          restore-keys: go-

      - name: Run tests (unit + integration)
        run: go test -race -tags integration -coverprofile=coverage.out ./...

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print substr($3, 1, length($3)-1)}')
          echo "Total coverage: ${COVERAGE}%"
          COV_INT=${COVERAGE%.*}
          if [ "$COV_INT" -lt "70" ]; then
            echo "::error::Coverage ${COVERAGE}% is below threshold 70%"
            exit 1
          fi

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ hashFiles('go.sum') }}
          restore-keys: go-

      - name: Build and scan binary
        run: |
          set -uo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          go build -o bin/documcp ./cmd/documcp

          # govulncheck: 0 = clean, 3 = vulnerabilities found, anything else =
          # the tool itself failed. The previous `|| true` swallowed all three
          # alike, so a crashed scan was indistinguishable from a clean one.
          govulncheck -mode=binary ./bin/documcp > /tmp/vulncheck.out 2>&1 && STATUS=0 || STATUS=$?
          cat /tmp/vulncheck.out

          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 3 ]; then
            echo "::error::govulncheck failed to run (exit $STATUS) — the scan result is unknown, treating as failure"
            exit 1
          fi

          # Fail on anything with a published fix; only "Fixed in: N/A" is
          # genuinely unpatched and downgraded to a warning.
          #
          # NOTE: stdlib findings render as "Fixed in: net@go1.26.6" — with no
          # leading "v". The previous gate matched 'Fixed in: v', so it could
          # not fail on a stdlib CVE at all. Do NOT reintroduce a v-anchored
          # pattern here.
          if grep -E '^[[:space:]]*Fixed in:' /tmp/vulncheck.out | grep -qv 'N/A'; then
            echo "::error::Fixable vulnerabilities found — upgrade the affected modules, or the Go toolchain in go.mod AND the Dockerfile builder image"
            exit 1
          fi
          if grep -q 'Vulnerability #' /tmp/vulncheck.out; then
            echo "::warning::Unfixed vulnerabilities detected (no patch available) — see scan output above"
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Audit dependencies
        # Includes devDependencies (vite, vitest, openapi-ts, eslint, etc.) so
        # build-tool supply-chain compromise is visible. --audit-level=high keeps
        # the gate at the same severity bar.
        run: cd frontend && npm audit --audit-level=high

      - name: Type check
        run: cd frontend && npx vue-tsc --noEmit

      - name: Run tests
        run: cd frontend && npx vitest run

      # web/frontend/dist/ is committed (it is go:embed'd into the Go
      # binary), so anything Vite inlines at build time gets checked in.
      # frontend/src/sentry.ts reads VITE_SENTRY_DSN from the environment;
      # a build on a machine where that is exported bakes the DSN — host
      # plus public key — into dist/assets/index-*.js.
      - name: Guard against secrets baked into the committed bundle
        run: |
          set -euo pipefail
          # Sentry/GlitchTip DSN shape: https://<hex key>@<host>/<project id>
          if grep -rIlE 'https://[0-9a-f]{16,}@[^/[:space:]]+/[0-9]+' web/frontend/dist/ 2>/dev/null; then
            echo "FAIL: the committed bundle contains a DSN-shaped credential (see files above)." >&2
            echo "Rebuild with VITE_SENTRY_DSN unset and recommit web/frontend/dist/." >&2
            exit 1
          fi
          echo "OK: no DSN-shaped credential in the committed bundle."

  grafana:
    name: Grafana Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"

      - name: Generate Grafana dashboard and alerts
        run: cd grafana && npm ci && npm run generate

      - name: Verify dashboard and alerts are up-to-date
        run: git diff --exit-code dist/documcp.json dist/alerts/documcp.json
