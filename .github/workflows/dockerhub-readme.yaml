name: Docker Hub README

on:
  push:
    branches: [main]
    paths: [README.md]

permissions:
  contents: read

jobs:
  update:
    name: Update Docker Hub Description
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa  # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: cpremus/documcp
          short-description: "MCP documentation server: full-text search, OAuth 2.1, PDF/DOCX/EPUB ingest"
          # Rewrites relative markdown links (the docs table) to absolute GitHub
          # URLs. It does not touch HTML src/href, so the README header uses
          # absolute URLs itself.
          enable-url-completion: true
